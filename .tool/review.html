<!doctype html>
<!--
  The RFC (or any Markdown in a PR) as a page, with the PR's line comments
  under the blocks they are about. Select text or tap + to draft a Q, Learn,
  Decision or Note; Send posts every draft as one PR review, so the queue
  reads them as line comments and answers under each.

    https://pietroteruya.dev/apptemplate/review.html?pr=7&path=product/research/…/README.md

  Static: GitHub Pages serves it (.github/workflows/review-page.yml), and it
  talks to api.github.com straight from the browser. Sending needs a
  fine-grained token for this repo (Pull requests: read and write), kept in
  this browser's localStorage only. See .tool/README.md, "review".
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script>
// The token is typed here: never on a page served over plain http.
if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) location.replace(location.href.replace(/^http:/, 'https:'));
</script>

<!--

  the style and the script marked id="deck" into its own page. A dark
  page of its own, apart from the app's look: true black, Onest
  only, borderless fills, 24/14/12 radii, lime only where it means something.
  Each `##` is a slide, an Onest display headline over its one point.
-->

<script id="deck">
// Turns rendered Markdown into slides. No framework: called by the page
// after each render, with `main` already holding a `.slide` per `##`.

// A block starts a slide when it opens with `## `; what comes before the
// first one is the cover (title and status line).
const startsSlide = (text) => /^##\s/.test(text);

function deckSlide(main, text) {
  const last = main.lastElementChild;
  if (last && !startsSlide(text)) return last;
  const slide = document.createElement('article');
  slide.className = 'slide' + (last ? '' : ' cover');
  main.append(slide);
  return slide;
}

// Numbers the slides ("03 / 12") and returns their headlines.
function deckNumber(main) {
  const slides = [...main.querySelectorAll('.slide:not(.cover)')];
  const pad = (n) => String(n).padStart(2, '0');
  slides.forEach((s, i) => (s.dataset.n = `${pad(i + 1)} / ${pad(slides.length)}`));
  return slides.map((s) => s.querySelector('h2')?.textContent ?? '');
}

// GitHub's alerts (> [!TIP]) and the RFC's notes (> **Q:**) get their colours.
const ALERTS = { IMPORTANT: 'The point', TIP: 'Keep', NOTE: 'Note', WARNING: 'Watch', CAUTION: 'Watch' };
function deckQuotes(el) {
  for (const q of el.querySelectorAll('blockquote')) {
    const first = q.querySelector('p');
    const alert = first?.innerHTML.match(/^\s*\[!(\w+)\]\s*(<br>)?/);
    if (alert && ALERTS[alert[1].toUpperCase()]) {
      const kind = alert[1].toLowerCase();
      first.innerHTML = first.innerHTML.slice(alert[0].length);
      if (!first.innerHTML.trim()) first.remove();
      const label = document.createElement('span');
      label.className = 'label';
      label.textContent = ALERTS[alert[1].toUpperCase()];
      q.prepend(label);
      q.classList.add('alert', `alert-${kind}`);
      continue;
    }
    const note = first?.querySelector('strong:first-child')?.textContent.match(/^(Q|A|Learn|Decision|Note)\b/);
    if (note && first.firstElementChild?.tagName === 'STRONG') q.classList.add(`note-${note[1]}`);
  }
}

// ```mermaid blocks become diagrams in the page's colours. Each source is drawn
// once and kept, since the pages redraw on every change.
let mermaidLoaded = null;
const drawn = new Map();
async function deckDiagrams(el) {
  const blocks = [...el.querySelectorAll('pre > code.language-mermaid')];
  if (!blocks.length) return;
  mermaidLoaded ??= import('https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs').then(async ({ default: m }) => {
    await document.fonts.ready;
    m.initialize({
      startOnLoad: false,
      theme: 'base',
      securityLevel: 'strict',
      fontFamily: 'Onest, system-ui, sans-serif',
      // Tight, so a diagram is scaled down less to fit a phone.
      flowchart: { nodeSpacing: 22, rankSpacing: 30, padding: 10, wrappingWidth: 150, diagramPadding: 4 },
      sequence: { actorMargin: 24, boxMargin: 6, noteMargin: 6, messageMargin: 28, diagramMarginX: 4, diagramMarginY: 4 },
      themeVariables: {
        darkMode: true, background: '#000', fontFamily: 'Onest, system-ui, sans-serif', fontSize: '16px',
        primaryColor: '#1c1c1c', primaryTextColor: '#f5f5f5', primaryBorderColor: '#1c1c1c',
        secondaryColor: '#2b2b2b', secondaryTextColor: '#f5f5f5', secondaryBorderColor: '#2b2b2b',
        tertiaryColor: '#0d0d0d', tertiaryTextColor: '#d4d4d4', tertiaryBorderColor: '#232323',
        lineColor: '#6b6b6b', textColor: '#d4d4d4', mainBkg: '#1c1c1c', nodeBorder: '#1c1c1c',
        clusterBkg: '#0d0d0d', clusterBorder: '#232323', edgeLabelBackground: '#000', titleColor: '#a1a1a1',
        actorBkg: '#1c1c1c', actorBorder: '#1c1c1c', actorTextColor: '#f5f5f5', actorLineColor: '#2b2b2b',
        signalColor: '#a1a1a1', signalTextColor: '#d4d4d4', labelBoxBkgColor: '#1c1c1c', labelBoxBorderColor: '#1c1c1c',
        labelTextColor: '#f5f5f5', loopTextColor: '#a1a1a1', noteBkgColor: '#2a1d10', noteTextColor: '#e5b27f', noteBorderColor: '#2a1d10',
        activationBkgColor: '#2b2b2b', activationBorderColor: '#2b2b2b', sequenceNumberColor: '#000',
        pie1: '#eeffbb', pie2: '#7c92e8', pie3: '#e5b27f', pie4: '#7fa496', pie5: '#e8697c', pieStrokeColor: '#000', pieTitleTextColor: '#f5f5f5', pieSectionTextColor: '#000', pieLegendTextColor: '#d4d4d4',
        git0: '#eeffbb', gitBranchLabel0: '#000',
        cScale0: '#1c1c1c', cScale1: '#2b2b2b', cScale2: '#17204a',
      },
      themeCSS: '.key > rect, .key > polygon, .key > circle, .key > path, rect.key { fill: #eeffbb !important; stroke: #eeffbb !important; } .key .nodeLabel, .key text, .key span { color: #000 !important; fill: #000 !important; }',
    });
    return m;
  });
  const mermaid = await mermaidLoaded;
  for (const code of blocks) {
    const src = code.textContent;
    const box = document.createElement('div');
    box.className = 'diagram';
    code.parentElement.replaceWith(box);
    if (!drawn.has(src)) {
      drawn.set(src, mermaid.render(`d${drawn.size}`, src).then((r) => r.svg).catch((e) => {
        console.error(`mermaid: ${e.message ?? e}`);
        return null;
      }));
    }
    const svg = await drawn.get(src);
    if (svg) box.innerHTML = svg;
    else {
      box.classList.add('failed');
      box.textContent = `This diagram did not draw:\n\n${src}`;
    }
  }
}

// Everything a block needs after marked: its quotes, then its diagrams.
// The page sets body[data-ready] once diagrams are drawn (.tool/doc shot waits on it).
async function deckFinish(main) {
  deckQuotes(main);
  await deckDiagrams(main);
  document.body.dataset.ready = '1';
}
</script>

<body>
<header><b id="name">Review</b><span id="at"></span><a id="pr" target="_blank"></a></header>
<main id="doc" class="deck"><p class="msg">Loading…</p></main>
<footer><span id="status"></span><button class="pill on" id="quote" hidden>Comment on selection</button><button class="pill go" id="send" disabled>Send</button></footer>

<script id="core">
// No DOM in this script, so a check can run it in Node.
const KINDS = ['Q', 'Learn', 'Decision', 'Note'];

// A block is a run of non-blank lines; a fenced code block stays one block
// even with blank lines inside it. Lines counted from 1, as GitHub does.
function blocksOf(text) {
  const lines = text.split('\n');
  const blocks = [];
  let start = -1;
  let fence = null;
  const close = (end) => blocks.push({ start: start + 1, end, text: lines.slice(start, end).join('\n') });
  for (let i = 0; i < lines.length; i++) {
    const marker = lines[i].match(/^\s*(```|~~~)/)?.[1];
    if (fence) {
      if (marker === fence) fence = null;
      continue;
    }
    if (marker) {
      if (start < 0) start = i;
      fence = marker;
    } else if (lines[i].trim() === '') {
      if (start >= 0) close(i);
      start = -1;
    } else if (start < 0) {
      start = i;
    }
  }
  if (start >= 0) close(lines.length);
  return blocks;
}

// What a line of Markdown reads as, near enough to find selected text in it.
const plain = (s) => s
  .replace(/!?\[([^\]]*)\]\([^)]*\)/g, '$1')
  .replace(/<[^>]+>/g, '')
  .replace(/[*_`~|>#]/g, '')
  .replace(/[“”"‘’']/g, '')
  .replace(/\s+/g, ' ')
  .trim()
  .toLowerCase();

// The lines a draft is about: the line the selected text starts on, or the
// whole block when nothing was selected (or the text can't be found).
function linesFor(block, quote) {
  const q = plain(quote ?? '');
  if (q) {
    const lines = block.text.split('\n');
    for (const len of [40, 20, 8]) {
      const head = q.slice(0, len);
      const i = lines.findIndex((l) => plain(l).includes(head));
      if (i >= 0) return { start: block.start + i, end: block.start + i };
    }
  }
  return { start: block.start, end: block.end };
}

const bodyOf = (d) => `${d.kind}: ${d.text.trim()}` + (d.quote ? `\n\n> ${d.quote.trim().replace(/\s+/g, ' ')}` : '');

// One review: each draft a comment on its lines, sent together so the queue
// takes them as one round.
function reviewOf(drafts, path, sha) {
  return {
    commit_id: sha,
    event: 'COMMENT',
    body: '',
    comments: drafts.map((d) => ({
      path,
      body: bodyOf(d),
      line: d.end,
      side: 'RIGHT',
      ...(d.start < d.end ? { start_line: d.start, start_side: 'RIGHT' } : {}),
    })),
  };
}

// When GitHub refuses the review (a line outside the PR's diff), the drafts
// go as one plain comment on the PR, each naming its file and line.
const fallbackOf = (drafts, path) => drafts
  .map((d) => `On \`${path}\` line ${d.start}${d.start < d.end ? `–${d.end}` : ''}:\n\n${bodyOf(d)}`)
  .join('\n\n---\n\n');

// The PR's line comments on this file, as threads, each under the block
// holding its line (the line it was left on, when it has moved since).
function threadsOf(comments, path, blocks) {
  const roots = comments.filter((c) => c.path === path && !c.in_reply_to_id);
  return roots.map((root) => {
    const line = root.line ?? root.original_line ?? 1;
    const at = blocks.findIndex((b) => line >= b.start && line <= b.end);
    return {
      block: at >= 0 ? at : blocks.length - 1,
      outdated: root.line == null,
      comments: [root, ...comments.filter((c) => c.in_reply_to_id === root.id)],
    };
  });
}
</script>

<script>
const params = new URLSearchParams(location.search);
const [owner, name] = (params.get('repo') ??
  (location.hostname.endsWith('.github.io') ? `${location.hostname.split('.')[0]}/${location.pathname.split('/')[1]}` : 'pietroid/apptemplate')).split('/');
const repo = `${owner}/${name}`;
const pr = params.get('pr');
let path = params.get('path');
const TOKEN = 'apptemplate-review-token';
const draftKey = () => `apptemplate-review:${repo}#${pr}:${path}`;

let head = null;      // the PR's head: { sha, ref }
let blocks = [];
let threads = [];
let drafts = [];
let composing = null; // { block, quote, kind, text }

const $ = (id) => document.getElementById(id);
const status = (s) => ($('status').textContent = s);

async function api(url, opts = {}) {
  const token = localStorage.getItem(TOKEN);
  const res = await fetch(`https://api.github.com/${url}`, {
    ...opts,
    headers: { accept: 'application/vnd.github+json', ...(token ? { authorization: `Bearer ${token}` } : {}), ...opts.headers },
  });
  if (!res.ok) throw Object.assign(new Error(`${res.status} ${(await res.json().catch(() => ({}))).message ?? res.statusText}`), { status: res.status });
  return opts.raw ? res.text() : res.json();
}

async function load() {
  // ?md=<path>: a file served next to this page, drawn alone (no PR, no
  // comments). How .tool/doc shot sees an RFC before it is pushed.
  if (params.get('md')) {
    path = params.get('md').replace(/^\//, '');
    const res = await fetch(`/${path}`);
    if (!res.ok) return fail(`Could not read ${path} (${res.status}).`);
    $('name').textContent = document.title = path.split('/').slice(-2).join('/');
    $('send').hidden = true;
    blocks = blocksOf(await res.text());
    return render();
  }
  if (!pr) return fail('Open this page with ?pr=<number> (and &path=<file.md>), as the queue\'s comment links it.');
  const p = await api(`repos/${repo}/pulls/${pr}`);
  head = { sha: p.head.sha, ref: p.head.ref };
  $('pr').textContent = `#${pr}`;
  $('pr').href = p.html_url;
  if (!path) {
    const files = await api(`repos/${repo}/pulls/${pr}/files?per_page=100`);
    path = files.map((f) => f.filename).find((f) => /^product\/.*README\.md$/.test(f)) ?? files.find((f) => f.filename.endsWith('.md'))?.filename;
    if (!path) return fail('This PR changes no Markdown.');
  }
  const [text, comments] = await Promise.all([
    api(`repos/${repo}/contents/${path}?ref=${head.sha}`, { raw: true, headers: { accept: 'application/vnd.github.raw' } }),
    api(`repos/${repo}/pulls/${pr}/comments?per_page=100`),
  ]);
  $('name').textContent = path.split('/').slice(-2).join('/');
  document.title = $('name').textContent;
  blocks = blocksOf(text);
  threads = threadsOf(comments, path, blocks);
  drafts = JSON.parse(localStorage.getItem(draftKey()) ?? '[]');
  render();
}

function fail(message) {
  $('doc').innerHTML = `<p class="msg"></p>`;
  $('doc').firstChild.textContent = message;
}

// Relative links in the Markdown point at the PR's files: pictures at its
// head commit, the rest on its branch.
function absolute(el) {
  const dir = path.split('/').slice(0, -1);
  const resolve = (rel) => {
    const parts = [...dir];
    for (const seg of rel.split('#')[0].split('/')) seg === '..' ? parts.pop() : seg !== '.' && parts.push(seg);
    return parts.join('/');
  };
  const relative = (u) => u && !/^([a-z]+:|#|\/)/i.test(u);
  el.querySelectorAll('img').forEach((img) => {
    const src = img.getAttribute('src');
    if (relative(src)) img.src = head ? `https://raw.githubusercontent.com/${repo}/${head.sha}/${resolve(src)}` : `/${resolve(src)}`;
  });
  el.querySelectorAll('a').forEach((a) => {
    const href = a.getAttribute('href');
    if (relative(href)) a.href = head ? `https://github.com/${repo}/blob/${head.ref}/${resolve(href)}` : `/${resolve(href)}`;
    a.target = '_blank';
  });
}

const who = (c) => `${c.user?.login ?? '?'} · ${new Date(c.created_at).toLocaleString()}`;

function render() {
  const main = $('doc');
  main.innerHTML = '';
  blocks.forEach((b, i) => {
    const el = document.createElement('section');
    el.className = 'block' + (composing?.block === i ? ' picked' : '');
    el.dataset.i = i;
    el.innerHTML = marked.parse(b.text);
    absolute(el);
    const add = document.createElement('button');
    add.className = 'add';
    add.textContent = '+';
    add.title = 'Comment on this block';
    add.onclick = () => compose(i, '');
    el.prepend(add);
    const slide = deckSlide(main, b.text);
    slide.append(el);
    for (const t of threads.filter((t) => t.block === i)) {
      const box = document.createElement('div');
      box.className = 'thread';
      for (const c of t.comments) {
        const row = document.createElement('div');
        row.className = 'c';
        row.innerHTML = `<div class="who"></div>${marked.parse(c.body)}`;
        row.firstChild.textContent = who(c) + (c === t.comments[0] && t.outdated ? ' · on an earlier version' : '');
        box.append(row);
      }
      slide.append(box);
    }
    drafts.forEach((d, n) => {
      if (d.block !== i) return;
      const box = document.createElement('div');
      box.className = 'draft';
      box.innerHTML = `<button title="Delete">×</button><div class="who">draft · line ${d.start}${d.start < d.end ? '–' + d.end : ''}</div>${marked.parse(bodyOf(d))}`;
      box.firstChild.onclick = () => { drafts.splice(n, 1); keep(); render(); };
      slide.append(box);
    });
    if (composing?.block === i) slide.append(composer());
  });
  deckNumber(main);
  deckFinish(main);
  where();
  $('send').disabled = !drafts.length;
  $('send').textContent = drafts.length ? `Send ${drafts.length}` : 'Send';
  status(threads.length ? `${threads.length} thread${threads.length > 1 ? 's' : ''}` : 'Select text or tap + to comment');
}

// The header names the slide in view.
function where() {
  const all = [...document.querySelectorAll('.slide:not(.cover)')];
  const at = all.filter((s) => s.getBoundingClientRect().top < 120).length;
  $('at').textContent = at ? `${at} / ${all.length}` : all.length ? `${all.length} slides` : '';
}
addEventListener('scroll', where, { passive: true });

const keep = () => localStorage.setItem(draftKey(), JSON.stringify(drafts));

function compose(block, quote) {
  composing = { block, quote, kind: composing?.kind ?? 'Q', text: composing?.text ?? '' };
  $('quote').hidden = true;
  $('status').hidden = false;
  render();
  document.querySelector('.composer textarea')?.focus();
}

function composer() {
  const box = document.createElement('div');
  box.className = 'composer';
  if (composing.quote) {
    const q = document.createElement('div');
    q.className = 'quote';
    q.textContent = '“' + composing.quote + '”';
    box.append(q);
  }
  const kinds = document.createElement('div');
  kinds.className = 'kinds';
  for (const k of KINDS) {
    const b = document.createElement('button');
    b.className = 'pill' + (k === composing.kind ? ' on' : '');
    b.textContent = k;
    b.onclick = () => { composing.kind = k; render(); };
    kinds.append(b);
  }
  const area = document.createElement('textarea');
  area.value = composing.text;
  area.placeholder = 'A question, something to go deeper on, a decision…';
  area.oninput = () => (composing.text = area.value);
  const actions = document.createElement('div');
  actions.className = 'actions';
  const cancel = document.createElement('button');
  cancel.className = 'pill';
  cancel.textContent = 'Cancel';
  cancel.onclick = () => { composing = null; render(); };
  const ok = document.createElement('button');
  ok.className = 'pill go';
  ok.textContent = 'Add';
  ok.onclick = () => {
    if (!composing.text.trim()) return;
    drafts.push({ ...composing, ...linesFor(blocks[composing.block], composing.quote) });
    composing = null;
    keep();
    render();
  };
  actions.append(cancel, ok);
  box.append(kinds, area, actions);
  return box;
}

// On a phone a selection has no mouseup, so a button offers it.
let picked = null;
document.addEventListener('selectionchange', () => {
  const sel = getSelection();
  const quote = sel.toString().trim();
  const block = sel.anchorNode?.parentElement?.closest?.('.block');
  picked = quote && block ? { block: Number(block.dataset.i), quote } : null;
  $('quote').hidden = !picked;
  $('status').hidden = !!picked;
});
$('quote').onclick = () => picked && compose(picked.block, picked.quote);

$('send').onclick = async () => {
  let token = localStorage.getItem(TOKEN);
  if (!token) {
    token = prompt('A GitHub fine-grained token for ' + repo + ' with "Pull requests: read and write" (github.com → Settings → Developer settings → Fine-grained tokens). It stays in this browser.');
    if (!token?.trim()) return;
    localStorage.setItem(TOKEN, token.trim());
  }
  $('send').disabled = true;
  status('Sending…');
  try {
    try {
      await api(`repos/${repo}/pulls/${pr}/reviews`, { method: 'POST', body: JSON.stringify(reviewOf(drafts, path, head.sha)) });
    } catch (e) {
      if (e.status !== 422) throw e;
      await api(`repos/${repo}/issues/${pr}/comments`, { method: 'POST', body: JSON.stringify({ body: fallbackOf(drafts, path) }) });
    }
    drafts = [];
    keep();
    await load();
    status('Sent. The queue answers under each comment in a few minutes.');
  } catch (e) {
    if (e.status === 401 || e.status === 403) localStorage.removeItem(TOKEN);
    status(`Not sent (${e.message}). Your drafts are kept.`);
    $('send').disabled = false;
  }
};

load().catch((e) => fail(`Could not load the PR: ${e.message}`));
</script>
</body>
</html>
