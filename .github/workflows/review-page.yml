name: Review page

# Publishes .tool/review.html on GitHub Pages: the RFC of a PR as a page you
# comment on from the phone, each comment a PR line comment the queue reads.
# Needs Pages set to "GitHub Actions" once (.tool/queue setup does it). A
# queue branch that changes the page deploys it too, so its PR is reviewed on
# the page it brings; the github-pages environment allows main and queue/*.
on:
  push:
    branches: [main, 'queue/**']
    paths: [.tool/review.html, .github/workflows/review-page.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}review.html
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp .tool/review.html _site/review.html && cp .tool/review.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
