server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Flutter web app: serve static files and fall back to index.html for
    # client-side routing. Flutter's file names carry no content hash
    # (main.dart.js stays main.dart.js), so nothing may be cached without
    # revalidating: otherwise Cloudflare's edge and browsers keep serving the
    # previous build for hours. The ETag makes revalidating an unchanged file
    # a cheap 304.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # API and Better Auth, passed through untouched: the backend serves
    # everything under /api itself, so the web app and its session cookie
    # share one origin. The variable defers DNS lookup to request time, so
    # nginx starts even if the backend container is not ready yet.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend "apptemplate-backend:3000";
        proxy_pass http://$backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PostHog, on the app's own origin so ad blockers let it through: its
    # script and assets, then everything it sends (US cloud). Replays are
    # posted in chunks bigger than nginx's 1 MB default.
    location ^~ /ingest/static/ {
        resolver 127.0.0.11 valid=60s;
        set $posthog_assets "us-assets.i.posthog.com";
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$posthog_assets;
        proxy_set_header Host $posthog_assets;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_assets;
    }

    location ^~ /ingest/ {
        resolver 127.0.0.11 valid=60s;
        set $posthog "us.i.posthog.com";
        rewrite ^/ingest/(.*)$ /$1 break;
        proxy_pass https://$posthog;
        proxy_set_header Host $posthog;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog;
        client_max_body_size 20m;
    }
}
